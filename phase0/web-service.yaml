# Benchmark web service for the HPA/VPA death-spiral experiment.
# Reuses the exact app pattern from ../../k8s/deployment.yaml (python:3.10-slim,
# inline ConfigMap, port 8080, WORK_ITERATIONS, /health) but lives ONLY in the
# isolated hv-phase0 namespace so it can never touch default/workload-cpu|io.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-code
  namespace: hv-phase0
data:
  app.py: |
    import hashlib, os, time, json, http.server, socketserver
    from urllib.parse import urlparse, parse_qs

    WORK_ITERATIONS = int(os.environ.get("WORK_ITERATIONS", "250"))

    # Resident memory ballast: GET /alloc?mb=N holds N MiB of touched pages so the
    # pod's RSS reflects a memory-bound working set (the CPU-burn path allocates
    # nothing). The RealClusterBackend drives this from the memory-bound trace, so
    # the memory axis has real ground truth: if the ballast exceeds the container's
    # memory limit the kernel OOM-kills it, exactly the pressure the policy must
    # avoid by raising the memory request. GRAN pages are touched to force real
    # pages resident under demand paging.
    _ballast = bytearray()

    def _set_ballast(mb):
        global _ballast
        n = max(0, int(mb)) * 1024 * 1024
        _ballast = bytearray()          # release the old buffer before allocating
        b = bytearray(n)
        for i in range(0, n, 4096):     # touch every page so RSS reflects the size
            b[i] = 1
        _ballast = b
        return n // (1024 * 1024)

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            p = urlparse(self.path)
            if p.path == "/health":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            if p.path == "/alloc":
                mb = _set_ballast(parse_qs(p.query).get("mb", ["0"])[0])
                self.send_response(200)
                self.send_header("Content-Type", "application/json"); self.end_headers()
                self.wfile.write(json.dumps({"ballast_mb": mb}).encode()); return
            t0 = time.monotonic()
            data = b"x" * 1024
            for _ in range(WORK_ITERATIONS):
                data = hashlib.sha256(data).digest()
            elapsed_ms = (time.monotonic() - t0) * 1000
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps({"status": "ok", "work_ms": round(elapsed_ms, 1)}).encode())
        def log_message(self, fmt, *args):
            pass

    with socketserver.ThreadingTCPServer(("", 8080), Handler) as s:
        s.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-service
  namespace: hv-phase0
  labels:
    app: web-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-service
  template:
    metadata:
      labels:
        app: web-service
    spec:
      containers:
      - name: web
        image: python:3.10-slim
        command: ["python", "/app/app.py"]
        ports:
        - containerPort: 8080
        # In-place resize policy (k8s 1.35 GA): CPU/mem request changes apply
        # WITHOUT restarting the container. The disruptive baseline patches the
        # Deployment template instead, forcing a rollout. This is the toggle.
        resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: NotRequired
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        env:
        - name: WORK_ITERATIONS
          value: "250"
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: web-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: hv-phase0
spec:
  selector:
    app: web-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
