# Horizontal Pod Autoscaler keyed on CPU *utilization* (= usage / request).
# This is the horizontal half of the coupled loop: when the VPA emulator changes
# the CPU request, the utilization percentage this HPA reads shifts underneath it,
# which is the mechanism behind the death spiral.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-service
  namespace: hv-phase0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-service
  minReplicas: 2
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  # NOTE: k8s default scale-down stabilizationWindowSeconds is 300s, which damps
  # oscillation. To EXPOSE the spiral, uncomment the tightened behavior below.
  # Keep the default first (realistic run), then rerun with this to show the
  # spiral is a real coupling effect, not an artifact of a slow HPA.
  #
  # behavior:
  #   scaleDown:
  #     stabilizationWindowSeconds: 15
  #     policies:
  #     - type: Percent
  #       value: 100
  #       periodSeconds: 15
  #   scaleUp:
  #     stabilizationWindowSeconds: 0
  #     policies:
  #     - type: Percent
  #       value: 100
  #       periodSeconds: 15
