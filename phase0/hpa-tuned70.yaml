# 70% variant of hpa-tuned.yaml (matches the vertical controller's 70% target).
# Tuned HPA for the spiral run: short stabilization + fast policies so the
# horizontal controller reacts quickly enough to visibly oscillate against the
# VPA emulator. Same object name as hpa.yaml (web-service), so applying this
# just updates the behavior in place.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-service
  namespace: hv-phase0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-service
  minReplicas: 2
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
